name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate HTML
        run: |
          # basic well-formedness check on all html files
          python3 - <<'PYEOF'
          import glob
          from html.parser import HTMLParser

          class Check(HTMLParser):
              def error(self, m):
                  raise Exception(m)

          for f in glob.glob('**/*.html', recursive=True):
              Check().feed(open(f, encoding='utf-8', errors='ignore').read())
          print('HTML parsed OK')
          PYEOF

      - name: Check assets referenced exist
        run: |
          python3 - <<'PYEOF'
          import glob, re, os
          missing = []
          for f in glob.glob('**/*.html', recursive=True):
              base = os.path.dirname(f)
              for m in re.findall(r'(?:src|href)="((?!https?:|mailto:|#|/)[^"]+)"', open(f, encoding='utf-8', errors='ignore').read()):
                  p = os.path.join(base, m.split('?')[0].split('#')[0])
                  if not os.path.exists(p):
                      missing.append((f, m))
          if missing:
              for f, m in missing:
                  print(f'MISSING: {f} -> {m}')
              raise SystemExit(1)
          print('all referenced assets exist')
          PYEOF
